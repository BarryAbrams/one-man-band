<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One Man Band Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="shell" x-data="dashboard()" x-init="init()">
      <section class="hero">
        <div>
          <p class="eyebrow">Closed-System Controller</p>
          <h1>One Man Band</h1>
          <p class="lede">
            Browser-based control surface for rails, solenoids, and future audio playback on the Pi.
          </p>
        </div>

        <div class="status-card">
          <div class="status-line">
            <span class="label">Status</span>
            <span class="badge" :class="state.connected ? 'ok' : 'error'" x-text="state.connected ? 'Connected' : 'Disconnected'"></span>
          </div>
          <p class="status-copy">
            Control the system power rails and solenoids from a single local interface.
          </p>
          <template x-if="state.error">
            <p class="error-text" x-text="state.error"></p>
          </template>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Power Rails</p>
            <h2>Supply Control</h2>
          </div>
          <div class="actions">
            <button class="secondary" @click="setAllRails(true)">All On</button>
            <button class="secondary" @click="setAllRails(false)">All Off</button>
          </div>
        </div>
        <div class="grid">
          <template x-for="name in meta.rails" :key="name">
            <button class="tile" :class="state.rails_map[name] ? 'active' : ''" @click="toggleRail(name)">
              <span class="tile-title" x-text="railLabels[name]?.title || name"></span>
              <span class="tile-subtitle" x-text="railLabels[name]?.subtitle || ''"></span>
              <span class="tile-value" x-text="state.rails_map[name] ? 'ON' : 'OFF'"></span>
            </button>
          </template>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Actuators</p>
            <h2>Solenoids</h2>
          </div>
          <div class="actions">
            <button class="secondary" @click="clearSolenoids()">Clear All</button>
            <button class="secondary" @click="refresh()">Refresh</button>
          </div>
        </div>
        <div class="grid">
          <template x-for="name in meta.solenoids" :key="name">
            <button class="tile" :class="state.solenoids_map[name] ? 'active warm' : ''" @click="toggleSolenoid(name)">
              <span class="tile-title" x-text="solenoidLabels[name] || name"></span>
              <span class="tile-subtitle" x-text="name"></span>
              <span class="tile-value" x-text="state.solenoids_map[name] ? 'ENGAGED' : 'IDLE'"></span>
            </button>
          </template>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Inputs</p>
            <h2>Pi GPIO Monitor</h2>
          </div>
          <div class="actions">
            <button class="secondary" @click="refresh()">Refresh</button>
          </div>
        </div>
        <div class="grid">
          <template x-for="name in meta.gpio_inputs || []" :key="name">
            <div class="tile" :class="state.gpio_inputs_map[name] ? 'active' : ''">
              <span class="tile-title" x-text="name"></span>
              <span class="tile-subtitle" x-text="`BCM ${meta.gpio_pins?.[name] ?? '?'}`"></span>
              <span class="tile-value" x-text="state.gpio_inputs_map[name] ? 'HIGH' : 'LOW'"></span>
            </div>
          </template>
        </div>
        <template x-if="state.gpio_error">
          <p class="error-text panel-note" x-text="state.gpio_error"></p>
        </template>
      </section>

    </main>

    <script>
      function dashboard() {
        return {
          meta: {{ metadata | tojson }},
          railLabels: {
            "12V_A": {
              title: "Audio Amp",
              subtitle: "12V_A rail",
            },
            "12V_B": {
              title: "Neopixels",
              subtitle: "12V_B rail",
            },
            "12V_C": {
              title: "Solenoid Voltage",
              subtitle: "12V_C rail",
            },
            "8V": {
              title: "Servos",
              subtitle: "8V rail",
            },
          },
          solenoidLabels: {
            "P0": "RL1",
            "P1": "RL2",
            "P2": "RL3",
            "P3": "RL4",
          },
          state: {
            connected: false,
            backend: "unknown",
            version: 0,
            error: "",
            rails_map: {},
            solenoids_map: {},
            gpio_inputs_map: {},
            gpio_error: "",
          },
          socket: null,
          socketConnected: false,
          pollHandle: null,

          init() {
            this.loadState();
            this.startPolling();

            if (typeof io === "undefined") {
              this.state = { ...this.state, error: "Socket.IO client failed to load" };
              return;
            }

            this.socket = io({
              transports: ["websocket", "polling"],
            });

            this.socket.on("connect", () => {
              this.socketConnected = true;
              this.loadState();
            });
            this.socket.on("disconnect", () => {
              this.socketConnected = false;
            });
            this.socket.on("connect_error", () => {
              this.socketConnected = false;
            });
            this.socket.on("meta:init", (payload) => {
              this.meta = payload;
            });
            this.socket.on("state:update", (payload) => {
              this.state = payload;
            });
            this.socket.on("server:error", (payload) => {
              this.state = { ...this.state, error: payload.message || "Unknown server error" };
            });
          },

          startPolling() {
            if (this.pollHandle) {
              clearInterval(this.pollHandle);
            }
            this.pollHandle = setInterval(() => {
              if (!this.socketConnected) {
                this.loadState();
              }
            }, 1000);
          },

          async loadState() {
            try {
              const response = await fetch("/api/state");
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }
              this.state = await response.json();
            } catch (error) {
              this.state = {
                ...this.state,
                connected: false,
                error: `Unable to load state: ${error.message}`,
              };
            }
          },

          refresh() {
            if (this.socketConnected && this.socket) {
              this.socket.emit("state:refresh");
              return;
            }
            this.loadState();
          },

          toggleRail(name) {
            if (this.socketConnected && this.socket) {
              this.socket.emit("rail:toggle", { name });
            }
          },

          setAllRails(enabled) {
            if (this.socketConnected && this.socket) {
              this.socket.emit("rails:set_all", { enabled });
            }
          },

          toggleSolenoid(name) {
            if (this.socketConnected && this.socket) {
              this.socket.emit("solenoid:toggle", { name });
            }
          },

          clearSolenoids() {
            if (this.socketConnected && this.socket) {
              this.socket.emit("solenoids:clear");
            }
          },
        };
      }
    </script>
  </body>
</html>
