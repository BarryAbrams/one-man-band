; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Upload_UPDI

[env]
platform = atmelmegaavr
framework = arduino
board = ATtiny1616
board_build.f_cpu = 16000000L
board_hardware.oscillator = internal
build_unflags = -g
build_flags = -Os -DCAN_MCP_CLOCK_HZ=16000000L
monitor_port = /dev/cu.SLAB_USBtoUART
monitor_speed = 115200

[env:Upload_UPDI]
upload_protocol = serialupdi
upload_port = /dev/cu.usbserial-1110
monitor_port = /dev/cu.SLAB_USBtoUART
upload_flags = 
build_flags = -Os -DCAN_MCP_CLOCK_HZ=16000000L
lib_deps = 
	adafruit/Adafruit MCP2515@^0.2.1

[env:Upload_UPDI_8MHz]
upload_protocol = serialupdi
upload_port = /dev/cu.usbserial-1110
monitor_port = /dev/cu.SLAB_USBtoUART
upload_flags = 
build_flags = -Os -DCAN_MCP_CLOCK_HZ=8000000L
lib_deps = 
	adafruit/Adafruit MCP2515@^0.2.1

[env:set_fuses]
upload_protocol = ${env:Upload_UPDI.upload_protocol}
upload_flags = 
board_hardware.bod = 2.6v
board_hardware.eesave = yes
board_hardware.updipin = updi
